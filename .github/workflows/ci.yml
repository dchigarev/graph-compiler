name: CI
run-name: >
  ${{
    github.event_name == 'schedule' && 'CI (nightly)' ||
    (github.event.inputs.LLVM_TAG || github.event.inputs.LLVM_URL) &&
      format('CI {0} {1}', github.event.inputs.LLVM_TAG, github.event.inputs.LLVM_URL) ||
    'CI'
  }}

on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      LLVM_URL:
        description: 'URL of the LLVM repository.'
        default: ''
      LLVM_TAG:
        description: 'Tag, branch, or hash of the LLVM repository.'
        default: ''
      LLVM_NO_PATCH:
        description: 'Do not apply patches to LLVM.'
        type: boolean
        default: false
      GC_DUMP_IR:
        description: 'Dump IRs after each phase.'
        type: boolean
        default: false
      GC_DEBUG:
        description: 'Regex pattern matching GC files to enable debug for.'
        default: ''

concurrency:
  group: ci-runner
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  GC_DYLINK: ON
  GC_BUILD_TYPE: Debug
  LLVM_BUILD_TYPE: RelWithDebInfo
  LLVM_INSTALL_DIR: ${{ github.workspace }}/externals/llvm
  OV_URL: https://x-access-token:${{ secrets.OV_TOKEN }}@github.com/dchigarev/openvino.git
  OV_TAG: mlir-gpu-gc-integration
  OV_INSTALL_DIR: ${{ github.workspace }}/externals/openvino
  TEST_RUNNER: ${{ github.workspace }}/.github/scripts/run_test.sh

jobs:
  ci:
    runs-on: ${{ vars.RUNNER }}
    concurrency:
      group: ci-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up env
        id: setup-env
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            echo 'LLVM_TAG=main' >> "$GITHUB_ENV" # Use the main branch for nightly builds
          elif [ -n '${{ github.event.inputs.LLVM_TAG }}' ]; then
            echo 'LLVM_TAG=${{ github.event.inputs.LLVM_TAG }}' >> "$GITHUB_ENV"
          fi
          [ -z '${{ github.event.inputs.LLVM_URL }}' ] || \
            echo 'LLVM_URL=${{ github.event.inputs.LLVM_URL }}' >> "$GITHUB_ENV"
          [ '${{ github.event.inputs.LLVM_NO_PATCH }}' = 'true' ] && \
            echo 'LLVM_NO_PATCH=1' >> "$GITHUB_ENV"
          if [ '${{ github.event.inputs.GC_DUMP_IR }}' = 'true' ]; then
            echo 'GC_DUMP_IR=1' >> "$GITHUB_ENV"
            echo 'OV_MLIR_DEBUG=1' >> "$GITHUB_ENV"
            echo 'GC_FILE_CACHE_OFF=1' >> "$GITHUB_ENV"
          fi
          [ -z '${{ github.event.inputs.GC_DEBUG }}' ] || \
            echo 'GC_DEBUG=${{ github.event.inputs.GC_DEBUG }}' >> "$GITHUB_ENV"

          grep -F '${LLVM_URL:=' scripts/compile.sh >> "$GITHUB_ENV"
          grep -F '${LLVM_TAG:=' scripts/compile.sh >> "$GITHUB_ENV"
          PROJECT_DIR="$PWD"
          . "$GITHUB_ENV"
          sed -i '/LLVM_URL/d' "$GITHUB_ENV"
          sed -i '/LLVM_TAG/d' "$GITHUB_ENV"

          resolve_sha() {
            echo "$2" | grep -qE '^[0-9a-f]{40}$' && { echo "$2"; return; }
            git ls-remote "$1" "refs/heads/$2" "refs/tags/$2" | awk '{print $1}' | head -1
          }
          LLVM_TAG=$(resolve_sha "$LLVM_URL" "$LLVM_TAG")
          OV_TAG=$(resolve_sha "$OV_URL" "$OV_TAG")
          echo "LLVM_URL=$LLVM_URL" >> "$GITHUB_ENV"
          echo "LLVM_TAG=$LLVM_TAG" >> "$GITHUB_ENV"
          echo "OV_TAG=$OV_TAG" >> "$GITHUB_ENV"

          echo "GITHUB_ENV - $GITHUB_ENV:"
          cat "$GITHUB_ENV"


      - name: List changed files
        id: ls
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          if git rev-parse -q --verify "$base^{commit}" || git fetch --no-tags --depth=1 origin "$base"; then
            revisions="$base $head"
          else
            revisions="$head"
          fi
          files=$(git diff --name-only $revisions | sort -u | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo -n "$f:" || true; done)
          echo "files=${files%:}" >> "$GITHUB_OUTPUT"

      - name: clang-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.(h|cpp)$/p' \
          | xargs -r -P $(nproc) clang-format --dry-run --Werror

      - name: cmake-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/(CMakeLists.txt|.+\.cmake)$/p' \
          | xargs -r -P $(nproc) cmake-format --check

      - name: Set up cache
        id: setup-cache
        run: |
          sha() { \
            echo "$@" | tr ' ' '\n' | sort | \
            while read i; do \
              [ -f "$i" ] && sha1sum "$i" || echo "$i"; \
            done | sha1sum | cut -d' ' -f1; \
          }

          venv_sha=$(sha scripts/create_venv.sh)
          llvm_sha=$(sha $venv_sha "$LLVM_TAG" "$LLVM_NO_PATCH" scripts/compile.sh patches/*.patch)
          ov_sha=$(sha $llvm_sha "$OV_TAG")
          echo "venv-key=venv-${venv_sha}" >> "$GITHUB_OUTPUT"
          echo "llvm-key=llvm-${llvm_sha}" >> "$GITHUB_OUTPUT"
          echo "ov-key=ov-${ov_sha}" >> "$GITHUB_OUTPUT"

          case '${{ github.event_name }}' in
            pull_request) user='%PR%' ;;
            schedule) user='NightlyBuild' ;;
            *) user='Manual' ;;
          esac
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Init cache
        uses: ./.github/actions/cache
        with:
          operation: init
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Load Python venv from cache
        id: load-venv
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: .venv
          key: ${{ steps.setup-cache.outputs.venv-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Create Python venv if not found in cache
        if: steps.load-venv.outputs.cache-hit != 'true'
        run: |
          bash -c scripts/create_venv.sh

      - name: Activate Python venv
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: ruff-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.py$/p' \
          | xargs -r -P $(nproc) ruff format --check

      - name: Load LLVM from cache
        id: load-llvm
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: ${{ env.LLVM_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.llvm-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Build and install
        run: |
          [ -z "$ONEAPI_ROOT" ] && . /opt/intel/oneapi/setvars.sh
          pip install -v -e python
          echo "LD_LIBRARY_PATH=${{ env.LLVM_INSTALL_DIR }}/lib:$PWD/build/install/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          lit_dir=externals/llvm-project/llvm/utils/lit
          if [ -d "$lit_dir" ]; then
            pip install "$lit_dir"
            ln -sf "$(which lit)" "${{ env.LLVM_INSTALL_DIR }}/bin/llvm-lit"
          fi

      - name: LLVM cleanup
        if: steps.load-llvm.outputs.cache-hit != 'true'
        run: |
          llvm_dir="${{ env.LLVM_INSTALL_DIR }}"
          rm -rf "$llvm_dir/share/"
          # To reduce the cache size, truncating the unused libs and binaries to zero size.
          # The files can not be simply removed because they are needed for cmake.
          find "$llvm_dir/lib/" -type f -name '*.a' -exec truncate -s 0 {} +
          find "$llvm_dir/bin/" -type f \
            ! -name FileCheck ! -name llvm-lit ! -name mlir-tblgen ! -name split-file \
            -exec truncate -s 0 {} +

      - name: Save Python venv to cache
        if: steps.load-venv.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: .venv
          key: ${{ steps.setup-cache.outputs.venv-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Save LLVM to cache
        if: steps.load-llvm.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: ${{ env.LLVM_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.llvm-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      # Temporary disabled due to https://github.com/llvm/llvm-project/issues/208735
      # - name: clang-tidy
      #   run: |
      #     echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.(h|cpp)$/p' \
      #     | xargs -r -P $(nproc) clang-tidy -p build --warnings-as-errors='*'

      - name: Run lit tests
        run: |
          cmake --build build --target gc-check

      - name: Run Python tests
        run: |
          test_dump_dir="$PWD/failed_test_dumps/python"
          rm -rf "$test_dump_dir"
          tests=$(pytest --collect-only -q python/test/ | grep '::')
          start=$SECONDS
          echo "$tests" | xargs -P 32 -I{} "$TEST_RUNNER" "$test_dump_dir" pytest -s 'python/{}'
          echo "Run $(echo "$tests" | wc -l) Python tests in $((SECONDS - start))s"

      - name: Upload failed Python test dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-python-test-dumps
          path: failed_test_dumps/python
          if-no-files-found: ignore

      - name: Load OpenVINO from cache
        id: load-ov
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: ${{ env.OV_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.ov-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Build OpenVINO if not found in cache
        if: steps.load-ov.outputs.cache-hit != 'true'
        run: |
          llvm_dir="${{env.LLVM_INSTALL_DIR}}"
          gc_dir="$PWD/build/install"
          ov_dir="${{env.OV_INSTALL_DIR}}"
          export GIT_LFS_SKIP_SMUDGE=1
          git init $ov_dir
          git -C $ov_dir fetch --depth 1 $OV_URL $OV_TAG
          git -C $ov_dir checkout FETCH_HEAD
          git -C $ov_dir submodule update --init --depth 1 --jobs $(nproc)
          cmake -G Ninja -S "$ov_dir" -B "$ov_dir/build" \
            -DLLVM_DIR=$llvm_dir/lib/cmake/llvm \
            -DMLIR_DIR=$llvm_dir/lib/cmake/mlir \
            -DENABLE_GRAPH_COMPILER=ON \
            -DLLVM_DYLINK=ON \
            -DENABLE_INTEL_GPU=ON \
            -DENABLE_TESTS=ON \
            -DENABLE_ONEDNN_FOR_GPU=OFF \
            -DENABLE_INTEL_CPU=OFF \
            -DENABLE_INTEL_NPU=OFF \
            -DCMAKE_CXX_FLAGS="-DOV_GPU_OPENCL_HPP_HAS_UUID -DOV_GPU_OPENCL_HPP_HAS_BUS_INFO" \
            -DGraphCompiler_DIR=$gc_dir/lib/cmake/GraphCompiler \
            -DOpenCL_HPP_INCLUDE_DIR="$ov_dir/thirdparty/ocl/clhpp_headers/include" \
            -DOpenCL_HPP="$ov_dir/thirdparty/ocl/clhpp_headers/include/CL/opencl.hpp"
          cmake --build "$ov_dir/build" --parallel $(nproc)
          # Remove unnecessary files to reduce the cache size
          bk=$ov_dir.bk
          mv $ov_dir $bk
          mkdir -p $ov_dir/bin/intel64/Release
          mkdir -p $ov_dir/src/plugins/intel_gpu/tests/functional/mlir_op
          cp $bk/bin/intel64/Release/ov_gpu_func_tests $ov_dir/bin/intel64/Release/
          cp $bk/bin/intel64/Release/*.so* $ov_dir/bin/intel64/Release/
          rm -rf $bk

      - name: Save OpenVINO to cache
        if: steps.load-ov.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: ${{ env.OV_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.ov-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Stale cache cleanup
        uses: ./.github/actions/cache
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: cleanup
          num-days: ${{ github.event_name == 'schedule' && 1 || -1 }}
          preserve-users: '%PRs%,NightlyBuild,Manual'

      - name: Run OpenVINO tests
        run: |
          export OV_GPU_ENABLE_MLIR=1
          export OV_GPU_QUEUE_TYPE=out-of-order
          ov_test_runner="${{env.OV_INSTALL_DIR}}/bin/intel64/Release/ov_gpu_func_tests"
          test_dump_dir="$PWD/failed_test_dumps/ov"
          rm -rf "$test_dump_dir"

          # Regex patterns of tests to exclude from the run.
          exclude=''
          filter=$(printf '%s:' \
            'MLIRExecution.SimpleMatmulf16' \
            'MLIRExecution.SDPABasic' \
            '*ScaledAttnLayerGPUMlirTest*' \
            'mlir_*' \
          )
          tests=$("$ov_test_runner" --gtest_list_tests --gtest_filter="${filter%:}" \
            | awk -v exclude="$exclude" '/^  /{print suite $1} /^[^ ]/{suite=$1}')
          [ -n "$exclude" ] && tests=$(echo "$tests" | grep -v -E "$exclude")

          start=$SECONDS
          echo "$tests" | xargs -P 32 -I{} "$TEST_RUNNER" "$test_dump_dir" "$ov_test_runner" --gtest_filter='{}'
          echo "Run $(echo "$tests" | wc -l) OV tests in $((SECONDS - start))s"

      - name: Upload failed OV test dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ov-test-dumps
          path: failed_test_dumps/ov
          if-no-files-found: ignore
