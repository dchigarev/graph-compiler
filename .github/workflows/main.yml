name: Build and test
run-name: >
  ${{
    github.event_name == 'schedule' && 'CI (nightly)' ||
    (github.event.inputs.LLVM_TAG || github.event.inputs.LLVM_URL) &&
      format('CI {0} {1}', github.event.inputs.LLVM_TAG, github.event.inputs.LLVM_URL) ||
    'CI'
  }}

on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      LLVM_URL:
        description: 'URL of the LLVM repository.'
        default: ''
      LLVM_TAG:
        description: 'Tag, branch, or hash of the LLVM repository.'
        default: ''
      LLVM_NO_PATCH:
        description: 'Do not apply patches to LLVM.'
        type: boolean
        default: false
      OV_URL:
        description: 'URL of the OpenVINO repository.'
        default: ''
      OV_TAG:
        description: 'Tag, branch, or hash of the OpenVINO repository.'
        default: ''
      GC_DUMP_IR:
        description: 'Dump IRs after each phase.'
        type: boolean
        default: false
      GC_DEBUG:
        description: 'Regex pattern matching GC files to enable debug for.'
        default: ''

concurrency:
  group: ci-runner
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  dylink:
    name: Dynamic linking
    runs-on: ${{ vars.RUNNER }}
    concurrency:
      group: ci-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      GC_DYLINK: ON
      GC_BUILD_TYPE: Debug
      LLVM_BUILD_TYPE: Release
      OV_BUILD_TYPE: Release
      LLVM_INSTALL_DIR: ${{ github.workspace }}/externals/llvm
      OV_INSTALL_DIR: ${{ github.workspace }}/externals/openvino
      TEST_RUNNER: ${{ github.workspace }}/scripts/run-test.sh

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up env
        id: setup-env
        run: |
          . scripts/utils.sh
          set_gh_env_var LLVM_URL '${{ github.event.inputs.LLVM_URL }}'
          set_gh_env_var LLVM_NO_PATCH '${{ github.event.inputs.LLVM_NO_PATCH }}'
          set_gh_env_var OV_URL '${{ github.event.inputs.OV_URL }}'
          set_gh_env_var OV_TAG '${{ github.event.inputs.OV_TAG }}'
          set_gh_env_var GC_DUMP_IR '${{ github.event.inputs.GC_DUMP_IR }}'
          set_gh_env_var GC_DEBUG '${{ github.event.inputs.GC_DEBUG }}'
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            set_gh_env_var LLVM_TAG main
          else
            set_gh_env_var LLVM_TAG '${{ github.event.inputs.LLVM_TAG }}'
          fi
          if is_true "$GC_DUMP_IR"; then
            echo 'OV_MLIR_DEBUG=1' >> "$GITHUB_ENV"
            echo 'GC_FILE_CACHE_OFF=1' >> "$GITHUB_ENV"
          fi

          PROJECT_DIR="$PWD"
          . scripts/build.sh
          echo "LLVM_TAG=$(git_sha "$LLVM_URL" "$LLVM_TAG")" >> "$GITHUB_ENV"
          echo "OV_TAG=$(git_sha "$OV_URL" "$OV_TAG")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GC_INSTALL_DIR/lib:$LLVM_INSTALL_DIR/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: List changed files
        id: ls
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          if git rev-parse -q --verify "$base^{commit}" || git fetch --no-tags --depth=1 origin "$base"; then
            revisions="$base $head"
          else
            revisions="$head"
          fi
          files=$(git diff --name-only $revisions | sort -u | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo -n "$f:" || true; done)
          echo "files=${files%:}" >> "$GITHUB_OUTPUT"

      - name: clang-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.(h|cpp)$/p' \
          | xargs -r -P $(nproc) clang-format --dry-run --Werror

      - name: cmake-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/(CMakeLists.txt|.+\.cmake)$/p' \
          | xargs -r -P $(nproc) cmake-format --check

      - name: Set up cache
        id: setup-cache
        run: |
          . scripts/utils.sh
          venv_sha=$(sha1 scripts/create-venv.sh)
          llvm_sha=$(sha1 $venv_sha "$LLVM_TAG" "$LLVM_NO_PATCH" scripts/build.sh patches/*.patch)
          ov_sha=$(sha1 $llvm_sha "$OV_TAG")
          echo "venv-key=venv-${venv_sha}" >> "$GITHUB_OUTPUT"
          echo "llvm-key=llvm-${llvm_sha}" >> "$GITHUB_OUTPUT"
          echo "ov-key=ov-${ov_sha}" >> "$GITHUB_OUTPUT"

          case '${{ github.event_name }}' in
            pull_request) user='%PR%' ;;
            schedule) user='NightlyBuild' ;;
            *) user='Manual' ;;
          esac
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Init cache
        uses: ./.github/actions/cache
        with:
          operation: init
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Load Python venv from cache
        id: load-venv
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: .venv
          key: ${{ steps.setup-cache.outputs.venv-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Create Python venv if not found in cache
        if: steps.load-venv.outputs.cache-hit != 'true'
        run: |
          bash -c scripts/create-venv.sh

      - name: Activate Python venv
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: ruff-format
        run: |
          echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.py$/p' \
          | xargs -r -P $(nproc) ruff format --check

      - name: Load LLVM from cache
        id: load-llvm
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: ${{ env.LLVM_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.llvm-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Build and install
        run: |
          export LLVM_BUILD_TARGET=install
          pip install -v -e python

          lit_dir=externals/llvm-project/llvm/utils/lit
          if [ -d "$lit_dir" ]; then
            pip install "$lit_dir"
            ln -sf "$(which lit)" "${{ env.LLVM_INSTALL_DIR }}/bin/llvm-lit"
          fi

      - name: LLVM cleanup
        if: steps.load-llvm.outputs.cache-hit != 'true'
        run: |
          llvm_dir="${{ env.LLVM_INSTALL_DIR }}"
          rm -rf "$llvm_dir/share/"
          # To reduce the cache size, truncating the unused libs and binaries to zero size.
          # The files can not be simply removed because they are needed for cmake.
          find "$llvm_dir/lib/" -type f -name '*.a' -exec truncate -s 0 {} +
          find "$llvm_dir/bin/" -type f \
            ! -name FileCheck ! -name llvm-lit ! -name mlir-tblgen ! -name split-file \
            -exec truncate -s 0 {} +

      - name: Save Python venv to cache
        if: steps.load-venv.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: .venv
          key: ${{ steps.setup-cache.outputs.venv-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Save LLVM to cache
        if: steps.load-llvm.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: ${{ env.LLVM_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.llvm-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      # Temporary disabled due to https://github.com/llvm/llvm-project/issues/208735
      # - name: clang-tidy
      #   run: |
      #     echo "${{ steps.ls.outputs.files }}" | tr ':' '\n' | sed -nE '/\.(h|cpp)$/p' \
      #     | xargs -r -P $(nproc) clang-tidy -p build/$GC_BUILD_TYPE --warnings-as-errors='*'

      - name: Run lit tests
        run: |
          cmake --build build/$GC_BUILD_TYPE --target gc-check

      - name: Run Python tests
        run: |
          test_dump_dir="$PWD/failed_test_dumps/python"
          rm -rf "$test_dump_dir"
          tests=$(pytest --collect-only -q python/test/ | grep '::')
          start=$SECONDS
          echo "$tests" | xargs -P 32 -I{} "$TEST_RUNNER" "$test_dump_dir" pytest -s 'python/{}'
          echo "Run $(echo "$tests" | wc -l) Python tests in $((SECONDS - start))s"

      - name: Upload failed Python test dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-python-test-dumps
          path: failed_test_dumps/python
          retention-days: 1
          if-no-files-found: ignore

      - name: Load OpenVINO from cache
        id: load-ov
        uses: ./.github/actions/cache
        with:
          operation: restore
          path: ${{ env.OV_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.ov-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Build OpenVINO if not found in cache
        if: steps.load-ov.outputs.cache-hit != 'true'
        run: |
          export LLVM_BUILD_TARGET=install
          export OV_DIR="${{env.OV_INSTALL_DIR}}-src"
          GC_BUILD_SKIP=1 LLVM_BUILD_SKIP=1 ./scripts/ov-build.sh
          rm -rf "$OV_DIR"

      - name: Save OpenVINO to cache
        if: steps.load-ov.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          operation: save
          path: ${{ env.OV_INSTALL_DIR }}
          key: ${{ steps.setup-cache.outputs.ov-key }}
          user: ${{ steps.setup-cache.outputs.user }}

      - name: Stale cache cleanup
        uses: ./.github/actions/cache
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: cleanup
          num-days: ${{ github.event_name == 'schedule' && 1 || -1 }}
          preserve-users: '%PRs%,NightlyBuild,Manual'

      - name: Run OpenVINO tests
        run: |
          ./scripts/ov-test.sh

      - name: Upload failed OV test dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ov-test-dumps
          path: failed_test_dumps/ov
          retention-days: 1
          if-no-files-found: ignore
